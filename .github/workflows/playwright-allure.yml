name: Playwright E2E Tests & Allure Report

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quyền để Actions push report lên nhánh gh-pages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers and OS Dependencies
        # Bước bắt buộc của Playwright để tải trình duyệt giả lập trên Ubuntu
        run: playwright install --with-deps chromium

      - name: Run Pytest Tests
        continue-on-error: true
        # Chạy test và lưu data thô vào thư mục 'reports'
        run: pytest --alluredir=reports

      - name: Install Allure Commandline
        if: always()
        # Sử dụng npm để cài Allure trực tiếp (cách ổn định nhất như bạn đã làm)
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        # Chuyển đổi data thô thành web HTML tĩnh tại thư mục 'allure-report'
        run: allure generate reports -o allure-report --clean

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
