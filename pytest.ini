[pytest]
pythonpath = .
testpaths = test
norecursedirs = .git venv .venv allure-results allure-report reports __pycache__ .pytest_cache

markers =
    tc_successful_login: Test successful login
    tc_unsuccessful_login: Test unsuccessful login
    tc_successful_register: Test successful register
    tc_unsuccessful_register: Test unsuccessful register
    tc_successful_edit_account: Test successful edit account
    tc_successful_enter_course: Test successful enter course
    tc_search_for_not_existing_course: Test search for non-existing course
    tc_e2e_auth: Test e2e auth workflow
    tc_successful_create_course: Test successful create course
    tc_successful_manage_course: Test successful manage course
    tc_successful_register_api: Test successful register API
    tc_unsuccessful_register_api: Test unsuccessful register API
    tc_e2e_course_learner: Test e2e course learner workflow
